[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ews-mcp"
version = "5.0.0a1"
description = "EWS MCP server — a lean, safety-gated, cache-first tool surface for an executive-mailbox assistant (see DESIGN.md)"
requires-python = ">=3.11"
dependencies = [
    "exchangelib==5.0.3",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "mcp>=1.27,<2",
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "tzdata",  # zoneinfo source of truth: slim images/Windows ship no OS tzdb
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
ewsmcp = "ewsmcp.main:main"
ewsd = "ewsmcp.daemon:main"

[tool.setuptools.packages.find]
include = ["ewsmcp*"]

[tool.setuptools.package-data]
"ewsmcp.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
cache_dir = ".pytest_cache_local"

[tool.ruff]
target-version = "py311"
line-length = 100
