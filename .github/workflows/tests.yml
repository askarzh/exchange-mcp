# CI: everything BLOCKING — no continue-on-error anywhere in this file.
# Also callable from publish.yml so publishing can never skip the tests.
name: tests

on:
  push:
    branches: ["**"]
  pull_request: {}
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      EWS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Lint (blocking)
        run: ruff check .
      - name: Unit + contract suites (blocking)
        run: python -m pytest tests -q
      - name: Docs match the registry (blocking)
        run: python scripts/dump_tool_table.py --check

  boot-smoke:
    # No-Exchange end-to-end: the real HTTP server against a dead endpoint —
    # never-exit boot, tier filtering, kill-switch, cold-gate, OpenAPI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install .
      - name: Boot smoke (tier=full)
        run: python scripts/boot_smoke.py full
      - name: Boot smoke (tier=draft)
        run: python scripts/boot_smoke.py draft

  docker-build:
    needs: [tests, boot-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t exchange-mcp:ci .
      - name: Import smoke inside the image
        run: docker run --rm exchange-mcp:ci python -c "import ewsmcp.main, ewsmcp.http, ewsmcp.cache.store; print('import smoke OK')"
